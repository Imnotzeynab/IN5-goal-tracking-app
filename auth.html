<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>IN5 — Account</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="auth-page">


    <main class="auth-container">


        <div class="section-label">
            IN5
        </div>


        <h1 id="auth-title">
            Welcome Back
        </h1>


        <p
            class="auth-intro"
            id="auth-intro"
        >
            Sign in.
        </p>


        <!-- =================================================
             AUTH FORM
        ================================================== -->

        <form id="auth-form">


            <!-- NAME — REGISTER ONLY -->

            <div id="name-field">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                >

            </div>


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <!-- SUBMIT -->

            <button
                type="submit"
                class="auth-button"
                id="auth-button"
            >
                Login
            </button>


            <!-- MESSAGE -->

            <p
                class="auth-message"
                id="auth-message"
            ></p>


        </form>


        <!-- =================================================
             LOGIN / REGISTER SWITCH
        ================================================== -->

        <div class="auth-switch">

            <span id="switch-text">
                Don't have an account?
            </span>

            <button
                type="button"
                class="text-button"
                id="switch-button"
            >
                Create Account
            </button>

        </div>


    </main>


    <!-- AUTH JAVASCRIPT -->

    <script src="auth.js"></script>

</body>

</html>
